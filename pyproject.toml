[project]
name = "CurseBreaker"
version = "4.9.0"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.14"
dependencies = [
    "bbcode>=1.1.0",
    "checksumdir>=1.3.0",
    "httpx[brotli,http2]>=0.28.1",
    "markdown>=3.10.3",
    "packaging>=26.3",
    "prompt-toolkit>=3.0.53",
    "pyperclip>=1.11.0",
    "python-dateutil>=2.9.0.post0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "certifi>=2026.7.22",
    "pyinstaller>=6.22.2",
    "ruff>=0.16.5",
]
